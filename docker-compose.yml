services:
  mathani:
    build: .
    image: mathani:local
    container_name: mathani
    restart: unless-stopped
    ports:
      - "7070:7070"
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "7070"
      DB_PATH: /app/data/app.db
      UPLOAD_DIR: /app/uploads
    volumes:
      - mathani-data:/app/data
      - mathani-uploads:/app/uploads
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:7070/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  mathani-data:
  mathani-uploads:
